services:
  main-db:
    build:
      context: images/database/server/
    container_name: main-db
    networks:
      - secure-network
    volumes:
      - ./main-db-data/database:/var/lib/postgresql
      - ./main-db-data/wals:/mnt/server/archivedir
      - ./main-db-data/base-backup:/mnt/server/base-backup
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST_AUTH_METHOD=${POSTGRES_HOST_AUTH_METHOD}
      - POSTGRES_USER=${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

  standby-db:
    build:
      context: images/database/standby
    container_name: standby-db
    networks:
      - secure-network
    volumes:
      - ./standby-db-data/database:/var/lib/postgresql
      - ./standby-db-data/wals:/mnt/server/archivedir
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST_AUTH_METHOD=${POSTGRES_HOST_AUTH_METHOD}
      - POSTGRES_USER=${POSTGRES_USER}
    depends_on:
      main-db:
        condition: service_healthy
        restart: true

  sensors:
    build:
      context: images/sensor
    container_name: sensor-readings
    networks:
      - secure-network
    depends_on:
      main-db:
        condition: service_healthy
        restart: true

#volumes:
#  main-db-data: 
#  standby-db-data:

networks:
  secure-network:
    internal: true
